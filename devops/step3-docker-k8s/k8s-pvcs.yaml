apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: images-pvc
  namespace: deepfake-ns
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: deepfake-ns
spec:
  accessModes: [ReadOnlyMany]
  resources:
    requests:
      storage: 10Gi
