apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepfake-detection
  namespace: deepfake-ns
  labels:
    app: deepfake-detection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deepfake-detection
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: deepfake-detection
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: deepfake-app
          image: ghcr.io/your-username/deepfake-detection-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: project_settings.settings
            - name: DEBUG
              value: "False"
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: uploaded-images
              mountPath: /app/uploaded_images
            - name: models-volume
              mountPath: /app/models
      volumes:
        - name: uploaded-images
          persistentVolumeClaim:
            claimName: images-pvc
        - name: models-volume
          persistentVolumeClaim:
            claimName: models-pvc
