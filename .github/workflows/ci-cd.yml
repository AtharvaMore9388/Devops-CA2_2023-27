name: Deepfake Detection - CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  IMAGE_NAME: deepfake-detection-app
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:

  # JOB 1 - Lint and Test
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        working-directory: "deepfake_vid/Deepfake_detection_using_deep_learning-master/Django Application"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 django django-prometheus
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless numpy Pillow

      - name: Lint with flake8
        working-directory: "deepfake_vid/Deepfake_detection_using_deep_learning-master/Django Application"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=127 --statistics

      - name: Django system check
        working-directory: "deepfake_vid/Deepfake_detection_using_deep_learning-master/Django Application"
        env:
          DJANGO_SETTINGS_MODULE: project_settings.settings
        run: python manage.py check || true

  # JOB 2 - Build and Push Docker Image
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: "deepfake_vid/Deepfake_detection_using_deep_learning-master/Django Application"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3 - Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Rolling update
        run: |
          IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)
          kubectl set image deployment/deepfake-detection deepfake-app=$IMAGE --namespace=deepfake-ns

      - name: Verify rollout
        run: kubectl rollout status deployment/deepfake-detection --namespace=deepfake-ns --timeout=120s

      - name: Auto-rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/deepfake-detection --namespace=deepfake-ns
          echo 'Rollback triggered - deployment failed health check'
